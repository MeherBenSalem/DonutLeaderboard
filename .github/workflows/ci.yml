name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Unit tests
        run: ./gradlew build
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: DonutLeaderboard
          path: build/libs/DonutLeaderboard-*.jar

  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: MySQL Testcontainers
        run: ./gradlew integrationTest

  smoke:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Version smoke harness (opt-in download)
        env:
          DONUT_LEADERBOARD_SMOKE_MATRIX: "1.20.1,1.21.1,26.3,folia-26.2"
        run: |
          chmod +x scripts/smoke-server-test.sh
          ./scripts/smoke-server-test.sh || echo "Smoke download/boot skipped when network or Java 25 runtime unavailable"
