name: CI

# NightBeam plugin CI: unit tests, the plugin.yml check (api-version '1.20', folia-supported, bStats ID, Java 17
# bytecode), MySQL integration tests, and a smoke boot on Paper 1.20.1, Paper 26.3 and the newest Folia.
# The wider local matrix (Purpur, SQLite/MySQL configs) stays in scripts/smoke-server-test.sh (./gradlew smokeServerBoot).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Check plugin.yml and bytecode
        run: python3 scripts/check_plugin_yml.py --jar build/libs/DonutLeaderboard-*.jar
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: DonutLeaderboard
          path: build/libs/DonutLeaderboard-*.jar
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: MySQL Testcontainers
        run: |
          chmod +x gradlew
          ./gradlew integrationTest

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: paper, version: "1.20.1" }
          - { project: paper, version: "26.3" }
          - { project: folia, version: latest }
    name: smoke (${{ matrix.project }} ${{ matrix.version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: actions/download-artifact@v4
        with:
          name: DonutLeaderboard
          path: artifact
      - name: Boot server
        run: >-
          python3 scripts/smoke_boot.py --project ${{ matrix.project }} --version ${{ matrix.version }}
          --jar 'artifact/DonutLeaderboard-*.jar' --name DonutLeaderboard --package io.nightbeam.donutleaderboard
          --command "lb reload"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.project }}-${{ matrix.version }}
          path: smoke-server/console.log
          if-no-files-found: ignore
